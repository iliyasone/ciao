# Push a tag vX.Y.Z (matching package.json) to publish a release; installed copies of Ciao find it
# through electron-updater (src/main/updater.ts) and offer to update. The release is uploaded as a
# draft and published only once every file is there: clients read latest.yml from the latest
# published release, so a half-uploaded one would break their checks. A rerun fills the same draft
# and leaves an already published release alone.
# electron-builder only builds: its own publishing races and splits the files over two releases
# (two artifacts finish together and each creates the release).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != package.json v$version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:native
      - run: npm run build:kws
      - run: npm run dist:win:installer
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          files=(release/Ciao-Setup-$version.exe release/Ciao-Setup-$version.exe.blockmap release/latest.yml)
          ls -l "${files[@]}"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>view.err); then
            [ "$draft" = true ] || { echo "$GITHUB_REF_NAME is already published"; exit 0; }
          elif grep -q "release not found" view.err; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$version" --generate-notes
          else
            cat view.err; exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
