# Typecheck and build the Windows installer, the macOS disk images and the Linux AppImage and .deb
# (both with a smoke test), and the Android APK on every PR, so a release tag never meets a broken
# build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:native
      - run: npm run build:kws
      - run: npm run dist:win:installer
      - run: test -f release/win-unpacked/resources/kws/model/tokens.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-Setup
          path: release/Ciao-Setup-*.exe
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:kws:linux
      - run: npm run dist:linux
      # On a Wayland desktop (headless weston with XWayland) the app must restart itself on X11:
      # an X11 GPU process given Wayland windows crashes. The wake word and the input helper ship.
      - name: The app starts on X11 under Wayland
        run: |
          test -f release/linux-unpacked/resources/kws/model/tokens.txt
          test -d release/linux-unpacked/resources/kws/koffi
          sudo apt-get update -q && sudo apt-get install -yq weston xwayland libfuse2t64
          export XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless --xwayland --socket=wl-ci > weston.log 2>&1 &
          for i in $(seq 30); do grep -q "xserver listening" weston.log && break; sleep 1; done
          export WAYLAND_DISPLAY=wl-ci XDG_SESSION_TYPE=wayland
          export DISPLAY=$(sed -n 's/.*xserver listening on display \(:[0-9]*\).*/\1/p' weston.log)
          test -n "$DISPLAY"
          chmod +x release/Ciao-*.AppImage
          # Returns once the app has restarted itself; without the restart it runs on and times out.
          timeout 30 release/Ciao-*.AppImage --no-sandbox > ciao.out 2>&1
          sleep 20
          cat ciao.out
          ps -eo args | grep -- '--type=gpu-process' | grep -v grep | grep -q -- '--ozone-platform=x11'
          log="$HOME/.config/Ciao/ciao.log"
          cat "$log"
          grep -q "started; history" "$log"
          grep -q '"type":"ready"' "$log"
          if grep -q "XGetWindowAttributes failed" ciao.out; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-Linux
          path: |
            release/Ciao-*.AppImage
            release/Ciao-*.deb
          retention-days: 7

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:native:mac
      # Nothing presses keys here; the helper must start, report its permission and answer commands.
      - name: Input helper answers
        run: |
          lipo -info build/mac-input/Ciao.Input | grep -q "x86_64 arm64"
          out=$(printf '{"id":1,"cmd":"foreground"}\n' | build/mac-input/Ciao.Input --trigger RMenu --trigger Ctrl+Space)
          echo "$out"
          echo "$out" | grep -q '"type":"ready"'
          echo "$out" | grep -q '"type":"permission"'
          echo "$out" | grep -q '"id":1'
      # electron-builder skips signing in PR builds; the ad-hoc signature uses no secrets, and an
      # unsigned Apple Silicon app doesn't start at all.
      - run: npm run dist:mac
        env:
          CSC_FOR_PULL_REQUEST: "true"
      - name: The app is signed and starts
        run: |
          for app in release/mac*/Ciao.app; do codesign --verify --deep --strict --verbose=2 "$app"; done
          release/mac-arm64/Ciao.app/Contents/MacOS/Ciao &
          sleep 20
          kill $! || true
          log="$HOME/Library/Application Support/Ciao/ciao.log"
          cat "$log"
          grep -q "started; history" "$log"
          grep -q "accessibility permission" "$log"
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-mac
          path: release/Ciao-*.dmg
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Without signing secrets (pull requests) the APK is signed with the runner's debug key.
      - run: ./gradlew testReleaseUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-Android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
