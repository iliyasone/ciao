# Typecheck and build the Windows installer, the Linux AppImage and .deb, and the Android APK on
# every PR, so a release tag never meets a broken build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:native
      - run: npm run build:kws
      - run: npm run dist:win:installer
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-Setup
          path: release/Ciao-Setup-*.exe
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:kws:linux
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-Linux
          path: |
            release/Ciao-*.AppImage
            release/Ciao-*.deb
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Without signing secrets (pull requests) the APK is signed with the runner's debug key.
      - run: ./gradlew testReleaseUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-Android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
