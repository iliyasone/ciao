# Typecheck and build the Windows installer on every PR, so a release tag never meets a broken build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:native
      - run: npm run build:kws
      - run: npm run dist:win:installer
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-Setup
          path: release/Ciao-Setup-*.exe
          retention-days: 7
