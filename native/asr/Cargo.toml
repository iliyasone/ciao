[package]
name = "ciao-asr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Ciao's on-device recognizer: tinyasr behind a JSON-lines helper (desktop) and JNI (Android)"
publish = false

[lib]
name = "ciao_asr"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ciao-asr"
path = "src/main.rs"

[dependencies]
# Telegram's on-device recognizer (GPL-3.0-or-later, models included); pinned with the model files in
# scripts/fetch-tinyasr.mjs.
tinyasr = { git = "https://github.com/dkaraush/tinyasr", rev = "58acbfdfd73e31523f4d9ec80b9aae3c0e582f49" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
